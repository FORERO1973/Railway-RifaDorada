version: '3.8'

services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: 3008
    container_name: rifadorada-bot
    restart: always
    ports:
      - "3008:3008"
    env_file:
      - .env
    volumes:
      - bot-session:/app/.builderbot
      - bot-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3008/v1/rifas"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-session:
  bot-uploads:
